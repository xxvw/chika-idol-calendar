name: CI

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy:dry-run:staging
      - run: npm run deploy:dry-run:production

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.0"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/staging init -backend=false
      - run: terraform -chdir=infra/environments/staging validate
      - run: terraform -chdir=infra/environments/production init -backend=false
      - run: terraform -chdir=infra/environments/production validate
